name: Docker images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_TAG: staging-${{ github.run_id }}

jobs:
  image:
    name: reloop-${{ matrix.app }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [api, app, agent]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/reloopcrm/reloop-${{ matrix.app }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/reloopcrm/reloop-${{ matrix.app }}:${{ env.STAGING_TAG }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=reloop-api-${{ matrix.arch }}
            type=gha,scope=reloop-app-${{ matrix.arch }}
            type=gha,scope=reloop-agent-${{ matrix.arch }}
          cache-to: type=gha,scope=reloop-${{ matrix.app }}-${{ matrix.arch }},mode=max

  publish:
    name: publish all three
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/reloopcrm/reloop-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
            type=sha

      - name: Stitch amd64 and arm64 into one manifest per app and apply the real tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          for app in api app agent; do
            repo="ghcr.io/reloopcrm/reloop-$app"
            args=()

            while read -r tag; do
              [ -n "$tag" ] || continue
              args+=(--tag "${repo}:${tag##*:}")
            done <<< "$META_TAGS"

            echo "Promoting $repo"
            docker buildx imagetools create "${args[@]}" \
              "${repo}:${STAGING_TAG}-amd64" \
              "${repo}:${STAGING_TAG}-arm64"
          done
