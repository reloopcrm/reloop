name: reloop

x-reloop: &reloop
  restart: unless-stopped

x-shared-env: &shared-env
  CRM_TELEMETRY_DISABLED:
  POSTHOG_KEY:
  POSTHOG_HOST:
  POSTHOG_UI_HOST:
  PRISMA_LOG_QUERIES:

x-sign-in-env: &sign-in-env
  ALLOWED_SIGN_IN:
  BETTER_AUTH_SECRET:
  API_URL:
  APP_URL:
  AUTH_COOKIE_DOMAIN:
  PASSWORD_SIGN_IN:
  GOOGLE_CLIENT_ID:
  GOOGLE_CLIENT_SECRET:
  MICROSOFT_CLIENT_ID:
  MICROSOFT_CLIENT_SECRET:
  MICROSOFT_TENANT_ID:
  SLACK_CLIENT_ID:
  SLACK_CLIENT_SECRET:

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.scope: reloop
    environment:
      POSTGRES_USER: reloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in deploy/.env. Run install.sh.}
      POSTGRES_DB: reloop
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reloop -d reloop"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    <<: *reloop
    image: ghcr.io/reloopcrm/reloop-api:${RELOOP_VERSION:-latest}
    labels:
      com.centurylinklabs.watchtower.scope: reloop
      com.centurylinklabs.watchtower.depends-on: reloop-postgres-1
    environment:
      <<: [*sign-in-env, *shared-env]
      DATABASE_URL: postgresql://reloop:${POSTGRES_PASSWORD}@postgres:5432/reloop
      AGENT_URL: http://agent:2000
      UPDATER_URL: http://updater:8080
      PORT: "3001"
      MAILBOX_SYNC_INTERVAL_MS: ${MAILBOX_SYNC_INTERVAL_MS:-300000}
      MAILBOX_SYNC_MAX_PER_TICK:
      MAILBOX_SYNC_BACKFILL_CHUNK:
      MAILBOX_SYNC_PAGE_SIZE:
      AGENT_BRIDGE_SECRET:
      CRON_SECRET:
      UPDATER_TOKEN:
      BLOB_READ_WRITE_TOKEN:
      OPENROUTER_API_KEY:
      REDIS_URL:
      CACHE_TTL_MS:
      RELOOP_UPDATE_CHECK:
      RELOOP_MANAGED:
      IS_MARKETING:
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *reloop
    image: ghcr.io/reloopcrm/reloop-app:${RELOOP_VERSION:-latest}
    labels:
      com.centurylinklabs.watchtower.scope: reloop
      com.centurylinklabs.watchtower.depends-on: reloop-api-1
    environment:
      <<: [*sign-in-env, *shared-env]
      DATABASE_URL: postgresql://reloop:${POSTGRES_PASSWORD}@postgres:5432/reloop
      AGENT_URL: http://agent:2000
      PORT: "3000"
      AGENT_BRIDGE_SECRET:
      IS_MARKETING:
      RELOOP_MANAGED:
      RELOOP_DEMO:
      RELOOP_PLANS:
      GOOGLE_SITE_VERIFICATION:
      RELOOP_CLOUD_URL: ${RELOOP_CLOUD_URL:-}
      RELOOP_SITE_URL: ${RELOOP_SITE_URL:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  agent:
    <<: *reloop
    image: ghcr.io/reloopcrm/reloop-agent:${RELOOP_VERSION:-latest}
    labels:
      com.centurylinklabs.watchtower.scope: reloop
      com.centurylinklabs.watchtower.depends-on: reloop-api-1
    environment:
      <<: *shared-env
      DATABASE_URL: postgresql://reloop:${POSTGRES_PASSWORD}@postgres:5432/reloop
      PORT: "2000"
      CODEX_HOME: /data/codex
      NODE_OPTIONS: ${AGENT_HEAP_MB:+--max-old-space-size=}${AGENT_HEAP_MB:-}
      AGENT_PORT:
      AGENT_BRIDGE_SECRET:
      BETTER_AUTH_SECRET:
      OPENROUTER_API_KEY:
      PERPLEXITY_API_KEY:
      TYPESAFE_API_KEY:
      BLOB_READ_WRITE_TOKEN:
      GITHUB_TOKEN:
    volumes:
      - codex:/data/codex
      - agent-workflows:/app/apps/agent/.eve/.workflow-data
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["caddy"]
    environment:
      RELOOP_DOMAIN: ${RELOOP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  updater:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    profiles: ["updater"]
    command: --http-api-update --scope reloop --cleanup
    environment:
      WATCHTOWER_HTTP_API_TOKEN: ${UPDATER_TOKEN:-}
      WATCHTOWER_SCHEDULE: ${UPDATER_SCHEDULE:-}
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      DOCKER_API_VERSION: ${UPDATER_DOCKER_API:-1.44}
    labels:
      com.centurylinklabs.watchtower.scope: reloop
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres-data:
  codex:
  agent-workflows:
  caddy-data:
  caddy-config:
